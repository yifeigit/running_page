[project]
name = "running_page"
version = "2.5.1"
description = "Default template for PDM package"
authors = [{ name = "yihong0618", email = "zouzou0208@gmail.com" }]
dependencies = [
  "httpx",
  "gpxpy==1.6.2",
  "stravalib==0.10.4",
  "appdirs>=1.4.0",
  "svgwrite>=1.1.9",
  "colour>=0.1.5",
  "s2sphere",
  "arrow",
  "geopy",
  "polyline",
  "sqlalchemy",
  "tzfpy; platform_system != \"Windows\"",
  "timezonefinder; platform_system == \"Windows\"",
  "pyyaml",
  "aiofiles",
  "cloudscraper",
  "tcxreader",
  "rich",
  "lxml",
  "eviltransform",
  "stravaweblib",
  "tenacity",
  "numpy",
  "tzlocal",
  "fit-tool",
  "garmin-fit-sdk",
  "haversine==2.8.0",
  "garth",
  "pycryptodome",
  "duckdb",
  "openai",
  "svglib>=1.5.1",
  "cairosvg>=2.7.1",
  "certifi==2025.1.31",
]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

# 固定 black 的解析目标版本。若不设置，black 会从 requires-python = ">=3.12"
# 推断出"3.12 及以后所有版本"（含尚未发布的 3.15），在 CI 的 Python 3.12/3.13
# 上触发 "cannot parse code formatted for Python 3.15" 安全校验告警。
[tool.black]
target-version = ["py312"]
line-length = 88

# 显式固定 ruff 的规则集。CI 用 `pip install ruff`（不锁版本）装最新版，
# 而 ruff 新版把默认规则集从 E4/E7/E9/F 扩大到了几乎全部规则族
# （实例：ruff 0.6.9 检查本仓库 0 项错误，ruff 0.16.7 检查同一份代码 307 项错误），
# 会让 `ruff check .` 直接退出码 1、CI 变红。此处显式声明项目实际遵循的规则集。
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
