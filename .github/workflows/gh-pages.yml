name: Publish GitHub Pages

# Controls when the action will run.
on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.prettier*'
      - 'Dockerfile'
      - 'nginx.conf'
      - 'vercel.json'
      - '.vercelignore'
      - 'docker-compose.yml'
      - 'run_page/**'
      - 'GPX_OUT/**'
      - 'TCX_OUT/**'
      - 'FIT_OUT/**'
      - 'PNG_OUT/**'
      - 'Workouts/**'
      - 'activities/**'
      - 'imported.json'
  workflow_dispatch:
    inputs:
      save_data_in_github_cache:
        required: true
        type: boolean
        default: false
      data_cache_prefix:
        required: true
        type: string
        default: track_data
  workflow_call:
    inputs:
      save_data_in_github_cache:
        required: true
        type: boolean
      data_cache_prefix:
        required: true
        type: string

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: true

# 构建与部署拆成两个 job：产物在 build job 里上传、在独立 deploy job 里读取，
# 避免 upload-pages-artifact 与 deploy-pages 同 job 时"产物刚 finalize 就查不到"的偶发竞态
# （actions/deploy-pages#451）。
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # if your default branches is not master, please change it here
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Cache Data Files
        if: inputs.save_data_in_github_cache
        uses: actions/cache@v4
        with:
          path: |
            activities
            assets
            GPX_OUT
            TCX_OUT
            FIT_OUT
            Workouts
            run_page/data.db
            src/static/activities.json
            imported.json
          key: ${{ inputs.data_cache_prefix }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ${{ inputs.data_cache_prefix }}-${{ github.sha }}-
            ${{ inputs.data_cache_prefix }}-

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable corepack
        run: npm install -g corepack@latest && corepack enable pnpm

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Build
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: PATH_PREFIX=/$REPO_NAME pnpm build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload dist repository
          name: pages-artifact
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: pages-artifact
